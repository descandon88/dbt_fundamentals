services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: DBT_POSTGRES
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:latest
    platform: linux/amd64
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - .:/usr/app
    working_dir: /usr/app
    depends_on:
      - postgres

volumes:
  pgdata: